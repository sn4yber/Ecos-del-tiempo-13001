<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecos del Tiempo - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .bg-chat { background-color: #0b141a; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; }
        .msg-in { background-color: #202c33; border-radius: 0 8px 8px 8px; }
        .msg-out { background-color: #005c4b; border-radius: 8px 0 8px 8px; }
        .scroll-smooth::-webkit-scrollbar { width: 6px; }
        .scroll-smooth::-webkit-scrollbar-thumb { background: #3b4a54; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[#111b21] p-4">

    <!-- Vista tipo celular -->
    <div class="w-full max-w-md h-full md:h-[90vh] bg-chat flex flex-col shadow-2xl overflow-hidden rounded-xl border border-gray-800 relative">
        
        <!-- Header -->
        <div class="bg-[#202c33] p-3 flex items-center shadow-sm z-10">
            <div class="w-10 h-10 bg-gray-600 rounded-full flex items-center justify-center overflow-hidden mr-3">
                <span class="text-xl">🏰</span>
            </div>
            <div>
                <h2 class="text-base font-semibold">Ecos del Tiempo</h2>
                <p class="text-xs text-[#8696a0]">Chatbot Inteligente</p>
            </div>
        </div>

        <!-- Chat Box -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 scroll-smooth pb-4">
            <div class="flex justify-start">
                <div class="msg-in p-2 px-3 max-w-[85%] text-[15px] shadow-sm leading-relaxed whitespace-pre-wrap">¡Hola! Yo soy Ecos del Tiempo. Escribe algo para iniciar nuestra demo del Hackathon (ej: Hola).</div>
            </div>
        </div>

        <!-- Inputs -->
        <div class="bg-[#202c33] p-3 flex items-center px-4">
            <input type="text" id="msg-input" class="flex-1 bg-[#2a3942] text-white rounded-lg px-4 py-3 outline-none text-[15px]" placeholder="Escribe un mensaje..." autocomplete="off" onkeypress="handleEnter(event)">
            <button onclick="sendMsg()" class="ml-3 bg-[#00a884] text-white p-3 rounded-full hover:bg-[#008f6f] transition flex items-center justify-center">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('msg-input');
        
        // Número que simulará ser el turista en la BD
        const MY_PHONE = '+573009998877';

        function addMessage(text, isOut = false) {
            const div = document.createElement('div');
            div.className = `flex ${isOut ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${isOut ? 'msg-out' : 'msg-in'} p-2 px-3 max-w-[85%] text-[15px] shadow-sm leading-relaxed whitespace-pre-wrap">${text}</div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMsg() {
            const text = input.value.trim();
            if(!text) return;
            
            addMessage(text, true); // Pintar en verde (saliente)
            socket.emit('user_message', { phone: MY_PHONE, text });
            input.value = '';
        }

        function handleEnter(e) {
            if(e.key === 'Enter') sendMsg();
        }

        socket.on('bot_message', (data) => {
            if(data.phone === MY_PHONE) {
                addMessage(data.text, false); // Pintar en gris (entrante de Ecos del Tiempo)
            }
        });
    </script>
</body>
</html>
